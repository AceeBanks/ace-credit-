# G0 Book 2 - B2.C3 Core Entity Catalog (machine-readable source of truth).
# Every root entity: identity prefix, scope, key fields, revision/state
# linkage. tools/g0/generate_domain_schemas.py derives schemas/g0/domain/*.json
# from this file; tools/g0/validate_domain.py validates it fail-closed.
entity_catalog_version: "1.0"
enums:
  OrganizationKind: [nonprofit, business, government_entity, educational_institution, tribal_entity, fiscal_sponsor, foundation, other_governed_extension]
  RoleType: [funder, applicant, recipient, partner, fiscal_sponsor]
  EntityStatus: [ACTIVE, INACTIVE, PENDING, SUPERSEDED]
  ResolutionStatus: [MATCH_CONFIRMED, MATCH_PROBABLE_REVIEW, DISTINCT_CONFIRMED, UNRESOLVED]
  ClaimStatus: [PROPOSED, VERIFIED, CONFLICTED, RETRACTED]
  FactPromotionState: [PROPOSED, PROMOTED, CONFLICTED, SUPERSEDED, RETIRED]
  EligibilityStatus: [ELIGIBLE, INELIGIBLE, CONDITIONAL, UNKNOWN]
  RequirementType: [narrative, attachment, form, certification, budget, eligibility_proof, partnership_support, financial, formatting, deadline_submission, other]
  ArtifactType: [research_report, match_explanation, application_blueprint, grant_proposal, business_plan, pitch_deck, budget_financial, partnership_material, testimonial_material, goal_sheet, qa_report, submission_package, client_explanation]
  ArtifactStatus: [DRAFT, QA_PENDING, REVIEW_REQUIRED, APPROVED_INTERNAL, SUBMISSION_READY, SUPERSEDED, MOCK]
  OutcomeType: [SUBMITTED, AWARDED, REJECTED, WITHDRAWN, REVISION_REQUESTED, NOT_SUBMITTED, UNKNOWN]
  VerificationState: [UNVERIFIED, CLAIMED, VERIFIED, CONFLICTED]
  Money: "decimal string, never float (B2.C12)"

