- {relationship_type: STATISTIC_DERIVED_FROM_SOURCE, source_entity_types: [StatisticObservation], target_entity_types: [SourceSnapshot], cardinality: "1:1", directed: true, temporal: false, attributes: [], provenance_required: true}
