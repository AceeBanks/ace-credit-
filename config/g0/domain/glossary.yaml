# G0 Book 2 - B2.C1 Domain Glossary & Ubiquitous Language (machine-readable).
# Freezes the vocabulary used by humans, agents, code, tests and UI.
# Every entry carries term/definition/what_it_is_not/identity_scope/
# mutable_attributes/source_of_truth_book/examples/common_confusions.
glossary_version: "1.0"
banned_ambiguous_aliases:
- grant                 # use GrantOpportunity or Award; 'grant' is ambiguous
- grant_application     # use ApplicationProject
- solicitation          # use GrantOpportunity / OpportunityRevision
- awardee               # use Recipient (role)
- grantee               # use Recipient (role)
- rfp                   # use GrantOpportunity
- nofo                  # use GrantOpportunity / OpportunityRevision
terms:
# --- Business actors and organizations ---
- {term: Organization, definition: Root legal or operational entity with stable internal identity independent of any grant source., what_it_is_not: A funding role, a contact person, or a specific grant award., identity_scope: global, mutable_attributes: [legal_name, display_name, status, jurisdiction, primary_location], source_of_truth_book: B2-C3, examples: [Community Youth Works Inc], common_confusions: [Funder, Recipient, Applicant, Partner]}
- {term: Person, definition: Stable natural-person identity for founders, officers, contacts, reviewers and external contacts., what_it_is_not: A contextual role binding to an organization., identity_scope: global, mutable_attributes: [name, role_titles], source_of_truth_book: B2-C3, examples: [founder, officer, reviewer], common_confusions: [OrganizationRole, Contact]}
- {term: OrganizationRole, definition: Contextual role binding an Organization to another object or time period, such as funder, applicant, recipient, partner or fiscal sponsor., what_it_is_not: A separate organization entity., identity_scope: contextual, mutable_attributes: [role_type, valid_from, valid_to], source_of_truth_book: B2-C2/C3, examples: [funder, applicant, recipient, partner, fiscal_sponsor], common_confusions: [Organization]}
- {term: Funder, definition: Role of an Organization that provides funding for a program or opportunity., what_it_is_not: A distinct entity type., identity_scope: role, mutable_attributes: [], source_of_truth_book: B2-C2, examples: [Georgia OPB as funder], common_confusions: [Organization]}
- {term: Recipient, definition: Role of an Organization that receives an award., what_it_is_not: A distinct entity type., identity_scope: role, mutable_attributes: [], source_of_truth_book: B2-C2, examples: [awardee], common_confusions: [Organization, Applicant]}
- {term: Applicant, definition: Role of an Organization that pursues a GrantOpportunity through an ApplicationProject., what_it_is_not: A distinct entity type., identity_scope: role, mutable_attributes: [], source_of_truth_book: B2-C2, examples: [client organization], common_confusions: [Organization, Recipient]}
- {term: Partner, definition: Role of an Organization collaborating on a project or proposal., what_it_is_not: A merged organization or generic supporter., identity_scope: role, mutable_attributes: [role_scope, valid_from, valid_to], source_of_truth_book: B2-C2, examples: [community partner, fiscal sponsor], common_confusions: [Organization, Contact]}
- {term: Contact, definition: Contextual relationship linking a Person to an Organization with role and reachability., what_it_is_not: The Person identity itself., identity_scope: contextual, mutable_attributes: [role, email, phone, valid_from, valid_to], source_of_truth_book: B2-C2, examples: [CEO contact for org-42], common_confusions: [Person]}
# --- Funding structure ---
- {term: Program, definition: Ongoing funding or assistance structure that may produce many GrantOpportunities across time., what_it_is_not: A specific solicitation or call., identity_scope: global, mutable_attributes: [name, description, status], source_of_truth_book: B2-C2/C3, examples: [Georgia OPB grant program], common_confusions: [GrantOpportunity, AssistanceListing]}
- {term: AssistanceListing, definition: Federal catalog number (ALN) identifying an ongoing assistance program., what_it_is_not: A GrantOpportunity., identity_scope: global, mutable_attributes: [title, agency], source_of_truth_book: B2-C3, examples: [ALN 84.007], common_confusions: [Program, GrantOpportunity]}
- {term: GrantOpportunity, definition: A specific opportunity or call under which an applicant may pursue funding; stable internal identity independent of its revisions., what_it_is_not: A Program, an Award, or one specific revision of terms., identity_scope: global, mutable_attributes: [title, status, agency], source_of_truth_book: B2-C2/C3, examples: [GA OPB Community Grant FY2026], common_confusions: [Program, OpportunityRevision, Award]}
- {term: OpportunityRevision, definition: Immutable material representation/version of an opportunity's terms; the exact target of eligibility, matching, requirements and application work., what_it_is_not: The GrantOpportunity root, nor a mutable doc., identity_scope: global (revision of one opportunity), mutable_attributes: [], source_of_truth_book: B2-C3/C8, examples: [OpportunityRevision 3 with new deadline], common_confusions: [GrantOpportunity]}
- {term: Award, definition: First-class historical or current award event with funder, recipient, amount, dates and links to program/opportunity where known., what_it_is_not: An ApplicationProject status., identity_scope: global, mutable_attributes: [amount, award_date, status], source_of_truth_book: B2-C2/C3, examples: [USAspending award to org-42], common_confusions: [ApplicationProject, ApplicationRevision]}
- {term: FundingInstrument, definition: The legal instrument class of funding, such as grant, cooperative agreement or contract., what_it_is_not: A FundingCategory., identity_scope: enum, mutable_attributes: [], source_of_truth_book: B2-C3, examples: [grant, cooperative_agreement], common_confusions: [FundingCategory]}
- {term: FundingCategory, definition: Thematic category of funding (client-facing), such as education, health, community development., what_it_is_not: A funding instrument., identity_scope: enum, mutable_attributes: [], source_of_truth_book: B2-C3, examples: [community_development], common_confusions: [FundingInstrument, Program]}
# --- Eligibility ---
- {term: EligibilityRule, definition: A typed normalized rule with operator and expected value against canonical facts., what_it_is_not: Raw solicitation prose or an eligibility result., identity_scope: per rule, mutable_attributes: [operator, expected_value, severity], source_of_truth_book: B2-C3/C10, examples: [applicant_type IN nonprofit], common_confusions: [EligibilityDecision, Requirement]}
- {term: EligibilityRuleSet, definition: A versioned set of EligibilityRules extracted and normalized from one OpportunityRevision., what_it_is_not: An ad hoc list of requirements., identity_scope: versioned, mutable_attributes: [], source_of_truth_book: B2-C10, examples: [rule set for GA-OPB-2026-01 rev 2], common_confusions: [Requirement]}
- {term: EligibilityDecision, definition: Deterministic evaluation result against Organization state, project facts, an OpportunityRevision and a specific EligibilityRuleSet version., what_it_is_not: An LLM narrative judgment., identity_scope: per evaluation, mutable_attributes: [], source_of_truth_book: B2-C3/C10, examples: [ELIGIBLE / INELIGIBLE / CONDITIONAL / UNKNOWN], common_confusions: [EligibilityRule, EligibilityStatus]}
- {term: EligibilityEvidence, definition: Canonical facts and claims supporting an eligibility evaluation., what_it_is_not: The decision itself., identity_scope: linked, mutable_attributes: [], source_of_truth_book: B2-C10, examples: [EIN fact, geography fact], common_confusions: [EligibilityDecision]}
- {term: EligibilityStatus, definition: Stable result status of an EligibilityDecision (ELIGIBLE, INELIGIBLE, CONDITIONAL, UNKNOWN)., what_it_is_not: A free-form verdict., identity_scope: enum, mutable_attributes: [], source_of_truth_book: B2-C3, examples: [CONDITIONAL], common_confusions: [EligibilityDecision, EligibilityRule]}
# --- Application production ---
- {term: ApplicationProject, definition: Internal durable aggregate representing the effort to pursue one opportunity for one organization; points to the exact OpportunityRevision., what_it_is_not: A CommonGrants Application or a single revision., identity_scope: global, mutable_attributes: [workflow state, requirements, artifacts, budget, QA state], source_of_truth_book: B2-C2/C3, examples: [app project for GA-OPB-2026-01], common_confusions: [ApplicationRevision, SubmissionPackage]}
- {term: ApplicationRevision, definition: Immutable or versioned application-state snapshot; prior client-approved or reviewed versions are never mutated away., what_it_is_not: The ApplicationProject root., identity_scope: versioned, mutable_attributes: [], source_of_truth_book: B2-C8, examples: [app revision 4 after client edits], common_confusions: [ApplicationProject]}
- {term: Requirement, definition: Typed requirement extracted and normalized from an opportunity/application instruction., what_it_is_not: A proposal section or response., identity_scope: per opportunity revision, mutable_attributes: [normalized state, satisfaction state], source_of_truth_book: B2-C3/C11, examples: [narrative, attachment, certification, budget], common_confusions: [ProposalSection, RequirementResponse]}
- {term: RequirementResponse, definition: The mechanism by which the application satisfies a Requirement (section, form value, budget, attachment, certification placeholder, support letter)., what_it_is_not: The Requirement itself., identity_scope: linked, mutable_attributes: [satisfaction state, artifact refs], source_of_truth_book: B2-C11, examples: [proposal section S04 satisfies narrative req], common_confusions: [Requirement]}
- {term: ProposalSection, definition: One authored section of a grant proposal artifact., what_it_is_not: A Requirement., identity_scope: within artifact, mutable_attributes: [content, status], source_of_truth_book: B2-C11, examples: [narrative, budget narrative], common_confusions: [Requirement, BusinessPlanSection]}
- {term: BusinessPlanSection, definition: One authored section of a business plan artifact, serving business viability rather than funder-response semantics., what_it_is_not: A ProposalSection., identity_scope: within artifact, mutable_attributes: [content, status], source_of_truth_book: B2-C11, examples: [market analysis, financial plan], common_confusions: [ProposalSection]}
- {term: Budget, definition: Structured financial plan with deterministic arithmetic and lineage to narrative and project assumptions., what_it_is_not: A free-text cost paragraph., identity_scope: per application project, mutable_attributes: [lines, version, currency, period], source_of_truth_book: B2-C3/C12, examples: [12-month project budget], common_confusions: [FinancialPackage, BudgetLine]}
- {term: BudgetLine, definition: One typed monetary line in a Budget with amount, category, period and assumption lineage., what_it_is_not: An untyped cost entry., identity_scope: within budget version, mutable_attributes: [amount, category, description], source_of_truth_book: B2-C12, examples: [staff salaries $50,000], common_confusions: [Budget]}
- {term: Artifact, definition: System or client work product such as proposal, business plan, research report, budget export or pitch deck., what_it_is_not: A SourceSnapshot of external state., identity_scope: global, mutable_attributes: [status, current_version_ref], source_of_truth_book: B2-C2/C3/C13, examples: [grant proposal, pitch deck], common_confusions: [SourceSnapshot, ArtifactVersion]}
- {term: ArtifactVersion, definition: Immutable authored or exported version of an Artifact with content, hash, format and generation lineage., what_it_is_not: The logical Artifact., identity_scope: versioned, mutable_attributes: [], source_of_truth_book: B2-C8/C13, examples: [proposal v3 PDF], common_confusions: [Artifact]}
- {term: SubmissionPackage, definition: Bundle and manifest of submission-ready artifacts; Phase 1 may prepare but never submit., what_it_is_not: Evidence of submission., identity_scope: per application project, mutable_attributes: [contents, readiness state], source_of_truth_book: B2-C13, examples: [final package for human review], common_confusions: [ApplicationProject, Submitted application]}
# --- Evidence ---
- {term: SourceSnapshot, definition: Immutable capture of external source state at a point in time., what_it_is_not: A client work product., identity_scope: per source+entity+time, mutable_attributes: [], source_of_truth_book: B2-C2/C8, examples: [snapshot of GA OPB page on 2026-08-01], common_confusions: [Artifact]}
- {term: EvidenceClaim, definition: A proposition asserted or extracted from a source or user input, with provenance and status., what_it_is_not: A promoted canonical fact., identity_scope: per claim, mutable_attributes: [status, confidence], source_of_truth_book: B2-C2/C9, examples: [organization has 501(c)(3) status], common_confusions: [CanonicalFact]}
- {term: CanonicalFact, definition: A promoted system assertion accepted for operational use under governance, retaining lineage to supporting claims., what_it_is_not: Any extracted claim., identity_scope: per fact, mutable_attributes: [promotion state, conflict status, effective interval], source_of_truth_book: B2-C2/C9, examples: [verified EIN fact], common_confusions: [EvidenceClaim]}
- {term: StatisticObservation, definition: Quantitative observation preserving metric, value, unit, geography, population, reference period and methodology., what_it_is_not: A bare numeric fact., identity_scope: per observation, mutable_attributes: [value, period], source_of_truth_book: B2-C9, examples: [county poverty rate 18.2% 2022], common_confusions: [CanonicalFact, generic Fact]}
- {term: EvidenceLink, definition: A typed link between evidence objects, e.g. claim asserted by snapshot, fact supported by claim., what_it_is_not: A generic foreign key., identity_scope: linked, mutable_attributes: [link_type, provenance], source_of_truth_book: B2-C6/C9, examples: [FACT_SUPPORTED_BY_CLAIM], common_confusions: [Relationship]}
- {term: ConflictState, definition: Explicit state when two claims disagree without deleting either., what_it_is_not: Silent resolution., identity_scope: per fact/claim pair, mutable_attributes: [status], source_of_truth_book: B2-C9, examples: [CONFLICTED], common_confusions: [resolution]}
# --- Relationships ---
- {term: Relationship, definition: A typed edge between two domain objects (organization-has-partner, opportunity-has-revision, award-funded-by, application-targets-revision) with cardinality, direction and provenance., what_it_is_not: An ad hoc foreign key or a database artifact., identity_scope: linked, mutable_attributes: [valid_from, valid_to], source_of_truth_book: B2-C6, examples: [PROGRAM_HAS_OPPORTUNITY], common_confusions: [EvidenceLink, foreign key]}
# --- Identity ---
- {term: ExternalIdentifier, definition: An identifier attached to an entity from an external namespace (EIN, UEI, ALN, opportunity number, FAIN, provider ID), carrying namespace, validity window and verification state., what_it_is_not: The entity's internal identity., identity_scope: per namespace, mutable_attributes: [verification_state, valid_from, valid_to], source_of_truth_book: B2-C4/C5, examples: [EIN 12-3456789, UEI ABC123], common_confusions: [Internal entity ID]}
- {term: CommonGrantsExtension, definition: A project-owned namespaced field carrying internal semantics (evidence lineage, eligibility trace, workflow state) through CommonGrants interoperability without claiming the standard represents it., what_it_is_not: A competing internal field or a standard-defined concept., identity_scope: per mapping, mutable_attributes: [value], source_of_truth_book: B2-C15, examples: [eligibility decision trace extension], common_confusions: [CommonGrants field]}
# --- Outcomes ---
- {term: OutcomeFeedback, definition: Downstream outcome observation useful for learning, e.g. awarded, rejected, revision requested., what_it_is_not: Automatic doctrine or prompt rewrite., identity_scope: per outcome, mutable_attributes: [verified_at, reason_codes, freeform_feedback], source_of_truth_book: B2-C14, examples: [REJECTED with reason code], common_confusions: [AwardOutcome, RejectionOutcome]}
- {term: AwardOutcome, definition: Outcome type meaning the application was awarded., what_it_is_not: The Award entity itself., identity_scope: enum, mutable_attributes: [], source_of_truth_book: B2-C14, examples: [AWARDED], common_confusions: [Award, OutcomeFeedback]}
- {term: RejectionOutcome, definition: Outcome type meaning the application was rejected, preserving reason feedback., what_it_is_not: Automatic policy change., identity_scope: enum, mutable_attributes: [], source_of_truth_book: B2-C14, examples: [REJECTED with reason_codes], common_confusions: [OutcomeFeedback]}
- {term: RevisionRequest, definition: Outcome type meaning the funder requested revisions., what_it_is_not: A rejection., identity_scope: enum, mutable_attributes: [], source_of_truth_book: B2-C14, examples: [REVISION_REQUESTED], common_confusions: [OutcomeFeedback, Requirement]}
