# G0 Book 1 - B1.C5 Capability Registry (machine-readable).
# Typed action vocabulary all future tool calls map into (LAW-B1-004).
# submission.* capabilities are registered but phase_status: DISABLED - they can
# never be reached while disabled, regardless of tool availability (LAW-B1-003).
registry_version: "1.0"
valid_side_effect_classes: [READ_ONLY, INTERNAL_WRITE, CANONICAL_MUTATION, EXTERNAL_ACTION, LEGALLY_MATERIAL]
valid_reversibilities: [TRIVIAL, RECOVERABLE, HARD]
valid_audit_classes: [A0, A1, A2, A3, A4]   # A0 telemetry-only (B1.C9)
valid_approval_classes: [AP0, AP1, AP2, AP3, APX]
valid_phase_statuses: [ENABLED, DISABLED, FUTURE]
capabilities:
# --- Organization ---
- capability_id: organization.read
  family: organization
  description: Read organization profile and canonical facts.
  minimum_level: L0
  allowed_actor_types: [ACTOR-HUMAN-CLIENT, ACTOR-HUMAN-ADMIN, ACTOR-HERMES-PERSONAL, ACTOR-HERMES-CEO, ACTOR-WORKER]
  resource_types: [organization_profile]
  requires_tenant_scope: true
  requires_project_scope: false
  approval_policy: AP0
  side_effect_class: READ_ONLY
  reversibility: TRIVIAL
  audit_class: A0
  rate_limit_class: standard
  input_schema_ref: schemas/g0/policy/capability.schema.json
  output_schema_ref: null
  failure_mode: F-SOURCE
  phase_status: ENABLED
- capability_id: organization.propose_update
  family: organization
  description: Propose a correction to the organization profile (non-canonical until accepted).
  minimum_level: L1
  allowed_actor_types: [ACTOR-HUMAN-CLIENT, ACTOR-HERMES-PERSONAL, ACTOR-HERMES-CEO, ACTOR-WORKER]
  resource_types: [organization_profile]
  requires_tenant_scope: true
  requires_project_scope: false
  approval_policy: AP1   # proposal is non-canonical, review-after; acceptance is human-approved (AP2)
  side_effect_class: INTERNAL_WRITE
  reversibility: RECOVERABLE
  audit_class: A1
  rate_limit_class: standard
  input_schema_ref: schemas/g0/policy/capability.schema.json
  output_schema_ref: null
  failure_mode: F-AUTH
  phase_status: ENABLED
- capability_id: organization.accept_verified_update
  family: organization
  description: Accept a verified profile update into canonical state (human-approved; deterministic execution).
  minimum_level: L3
  allowed_actor_types: [ACTOR-HUMAN-CLIENT, ACTOR-HUMAN-ADMIN, ACTOR-DETERMINISTIC-SERVICE]
  resource_types: [organization_profile]
  requires_tenant_scope: true
  requires_project_scope: false
  approval_policy: AP2
  side_effect_class: CANONICAL_MUTATION
  reversibility: RECOVERABLE
  audit_class: A2
  rate_limit_class: standard
  input_schema_ref: schemas/g0/policy/capability.schema.json
  output_schema_ref: null
  failure_mode: F-AUTH
  phase_status: ENABLED
- capability_id: organization.attach_evidence
  family: organization
  description: Attach lineage-bearing evidence to an organization fact.
  minimum_level: L2
  allowed_actor_types: [ACTOR-HERMES-CEO, ACTOR-WORKER]
  resource_types: [organization_profile, evidence_record]
  requires_tenant_scope: true
  requires_project_scope: true
  approval_policy: AP1
  side_effect_class: INTERNAL_WRITE
  reversibility: RECOVERABLE
  audit_class: A2
  rate_limit_class: standard
  input_schema_ref: schemas/g0/policy/capability.schema.json
  output_schema_ref: null
  failure_mode: F-EVIDENCE
  phase_status: ENABLED
