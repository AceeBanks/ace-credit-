# G0 Book 4 - B4.C11/C18 Context Budget & Assembly Policy (machine-readable).
# Context is a scarce resource allocated by relevance/authority. Assembly is
# deterministic: same durable state + same active intent -> same mandatory refs.
context_budget_policy_version: "1.0"

assembly_order:
- REQUIRED_CANONICAL_STATE
- REQUIRED_CURRENT_EVIDENCE
- ACTIVE_TASK_PROJECT_STATE
- MANDATORY_POLICY_CONSTRAINTS
- PROMOTED_ROLE_SPECIFIC_MEMORY
- SELECTED_RECENT_INTERACTION_CONTEXT
- OPTIONAL_SUPPORTING_HISTORY_WITHIN_BUDGET

priority_classes:
  P0_MANDATORY:
    - POLICY
    - TENANT
    - CURRENT_OBJECTIVE
    - ACTIVE_OPPORTUNITY_REVISION
    - CRITICAL_FACTS
  P1_HIGH:
    - RELEVANT_EVIDENCE
    - ACTIVE_TASK_STATE
    - PROMOTED_MEMORY
  P2_SUPPORTING:
    - RECENT_INTERACTIONS
    - SUPPORTING_RESEARCH
  P3_OPTIONAL:
    - HISTORICAL_EPISODIC_CONTEXT

never_default_inject:
- ENTIRE_USER_HISTORY
- ENTIRE_WORKER_TRACES
- CLOSED_PROJECT_TRANSCRIPTS
- RAW_SECRETS
- IRRELEVANT_APPLICATION_DOCUMENTS
- SUPERSEDED_MEMORY

budget_units: [TOKENS_OR_CHARACTERS, ITEM_COUNT, RELEVANCE_CLASS, MANDATORY_VS_OPTIONAL_PRIORITY]

anchor_policy:
  mandatory_anchors_survive: ALWAYS
  anchor_priority: P0_MANDATORY
  violation: ASSEMBLY_ERROR

retrieval_order:
- EXACT_REQUIRED_REFS
- ACTIVE_STATE
- ROLE_SPECIFIC_MEMORY_CLASS
- SEMANTIC_RELEVANCE
- RECENCY_AS_TIEBREAKER_ONLY
