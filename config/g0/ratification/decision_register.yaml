  title: Promptfoo + Hermes Evaluation Lab regression/red-team loop
  status: RATIFIED_WITH_CONDITION
  category: control/governance
  statement: >-
    The archived Hermes skill-creator benchmark loop (candidate vs baseline, parallel evals,
