# G0 Book 0 - R0 Decision Register (machine-readable).
# Every major R0 conclusion normalized into exactly one primary status:
#   RATIFIED | RATIFIED_WITH_CONDITION | PROTOTYPE_REQUIRED | DEFERRED | REJECTED | UNRESOLVED
# Every source_artifact_id MUST resolve to an entry in artifact_manifest.yaml.
register_version: 1
required_categories:
  - architecture
  - Hermes
  - memory/context
  - control/governance
  - data/source
  - research
  - parsing
  - security
  - evidence
  - external repositories
  - licensing
  - Georgia-first
  - client Phase 1
  - mock drafting milestones
  - submission boundary
  - reject ledger
valid_statuses:
  - RATIFIED
  - RATIFIED_WITH_CONDITION
  - PROTOTYPE_REQUIRED
  - DEFERRED
  - REJECTED
  - UNRESOLVED
decisions:
- decision_id: DEC-ARCH-001
  title: Dual-Hermes architecture
  status: RATIFIED
  category: architecture
  statement: >-
    The platform operates two distinct Hermes profiles: a Personal Hermes facing the client
    (relationship continuity, intent formation) and a CEO Hermes operating the system
    (planning, application operation). They are separate identities with separate memory,
    authority, and retention policies, joined by the IntentContract seam.
  rationale: >-
    Charter defines the Dual-Hermes model as core product architecture; seed architecture
    packages A/B depend on it; reject ledger forbids one shared mutable memory namespace.
  source_artifact_ids: [GS-R0-CTX-001, GS-R0-SEED-001, GS-R0-REJECT-001]
  conditions: []
  affected_books: [G0-B1, G0-B2]
  implementation_implications: >-
    Book 1 must define actor identities and authority levels per profile; no shared memory namespace may be implemented.
  supersedes_decision_id: null
- decision_id: DEC-ARCH-002
  title: Relationship / Control / Work / Data plane separation
  status: RATIFIED
  category: architecture
  statement: >-
    The reference architecture separates four planes: client relationship plane (Personal Hermes),
    governed control plane (identity/tenant/policy/audit/event/project state + CEO Hermes),
    worker/tool fabric plane, and data/artifact plane. Cross-plane interaction happens only
    through typed contracts (IntentContract, TaskContract, WorkerResult, OutcomeArtifact).
  rationale: Seed architecture section 1 fixes this reference topology; salvage map confirms reusable patterns align to these seams.
  source_artifact_ids: [GS-R0-SEED-001, GS-R0-MAP-001]
  conditions: []
  affected_books: [G0-B0, G0-B1, G0-B2, G0-B3]
  implementation_implications: Contracts frozen in G0 become stable swap seams; workers never bypass the control plane.
  supersedes_decision_id: null
- decision_id: DEC-ARCH-003
  title: Clean-repository selective transplant, not branch merge
  status: RATIFIED
  category: architecture
  statement: >-
    The future Grant Sector product is seeded by deliberate transplant of selected components
    behind new product interfaces into a clean repository. Merging master,
    execution-runtime-foundation, or Hermes archives wholesale is prohibited.
  rationale: Salvage map executive finding and archaeology notes show legacy coupling (SQLite, Obsidian, trading nomenclature, prototype-grade code) makes wholesale merges unsafe.
  source_artifact_ids: [GS-R0-MAP-001, GS-R0-ARCH-001, GS-R0-REJECT-001]
  conditions: []
  affected_books: [G0-B2, G0-B3]
  implementation_implications: Each transplanted component needs a bounded validation step before promotion; historical test-count claims are not current proof.
  supersedes_decision_id: null
- decision_id: DEC-HERMES-001
  title: Hermes operates; the platform owns truth
  status: RATIFIED
  category: Hermes
  statement: >-
    Hermes profiles are operators acting through governed capabilities. Neither Hermes is a
    sovereign product-truth store; canonical state lives outside agent memory in durable storage.
  rationale: Seed architecture law 1 and reject ledger anti-pattern "model used as authoritative database".
  source_artifact_ids: [GS-R0-SEED-001, GS-R0-REJECT-001, GS-R0-CTX-001]
  conditions: []
  affected_books: [G0-B1, G0-B2]
  implementation_implications: Book 1 constitutional layer must dominate tool availability; agent instructions alone are never sufficient authorization.
  supersedes_decision_id: null
- decision_id: DEC-HERMES-002
  title: OCE-Hermes filtered MCP facade pattern
  status: RATIFIED_WITH_CONDITION
  category: Hermes
  statement: >-
    Both Hermes profiles access product capabilities only through a governed MCP-style facade
    derived from the oce-hermes-telegram-operator pattern: schema validation, service identity,
    redaction, rate limiting, request IDs, structured audit, and adversarial gateway tests.
  rationale: Salvage map Tier A rates this FORK/PORT confidence A; seed package A adopts it.
  source_artifact_ids: [GS-R0-MAP-001, GS-R0-SEED-001]
  conditions:
    - Fresh dependency/security verification before any production use of salvaged gateway code.
    - Capability matrix and tenant/project scope enforced server-side, not in Hermes config.
  affected_books: [G0-B1, G0-B2]
  implementation_implications: Tool registry and credential vault/injection are server-side components; Hermes holds no direct DB or secret access.
  supersedes_decision_id: null
- decision_id: DEC-MEM-001
  title: Personal and CEO memory isolation
  status: RATIFIED
  category: memory/context
  statement: >-
    Personal and CEO Hermes maintain separate memory namespaces with distinct promotion and
    retention policies. Sharing one mutable memory across roles is rejected.
  rationale: Salvage map Five-Pillar disposition requires role separation; reject ledger lists shared-memory anti-pattern explicitly.
  source_artifact_ids: [GS-R0-MAP-001, GS-R0-REJECT-001]
  conditions: []
  affected_books: [G0-B2, G0-B4]
  implementation_implications: Memory subsystem must key namespaces by actor identity; cross-role promotion is prohibited.
  supersedes_decision_id: null
- decision_id: DEC-MEM-002
  title: Workers bounded/disposable with sidechain trace isolation
  status: RATIFIED
  category: memory/context
  statement: >-
    Workers are bounded and disposable. Full worker transcripts live in sidechain/audit storage;
    parents receive concise result packets plus pointers. Injecting full worker transcripts into
    parent context is rejected. Workers receive no autobiographical long-term memory.
  rationale: Salvage map sidechain pattern (confidence A); seed architecture law 3; reject ledger anti-patterns.
  source_artifact_ids: [GS-R0-MAP-001, GS-R0-SEED-001, GS-R0-REJECT-001]
  conditions: []
  affected_books: [G0-B2, G0-B3]
  implementation_implications: Trace metadata/artifact references go to durable storage with retention classes and redaction.
  supersedes_decision_id: null
- decision_id: DEC-MEM-003
  title: Context compaction with preservation classes
  status: RATIFIED_WITH_CONDITION
  category: memory/context
  statement: >-
    Context compaction follows the five-layer historical protocol rewritten with preservation
    classes instead of fixed turn windows, distinct Personal vs CEO policies, canonical-state
    references, compaction provenance, stale-memory demotion, and no secrets in compacted memory.
  rationale: Salvage map 3.4 lists required improvements over the archived implementation.
  source_artifact_ids: [GS-R0-MAP-001]
  conditions:
    - Compaction provenance must be recorded so any compaction is replayable/auditable.
  affected_books: [G0-B2, G0-B4]
  implementation_implications: Combine with OCE anchor-preservation concept; never copy durable facts into summaries.
  supersedes_decision_id: null
- decision_id: DEC-GOV-001
  title: Typed capability/policy enforcement replaces regex-only denylists
  status: RATIFIED
  category: control/governance
  statement: >-
    Agent action control is a typed capability registry plus policy decision point evaluating
    actor, tenant, project, capability, resource, authority level, and risk class. Regex
    denylists survive only as defense-in-depth, never as sole authorization.
  rationale: Salvage map pre-tool hook disposition and reject ledger "regex denylist as sole authorization control" rejection.
  source_artifact_ids: [GS-R0-MAP-001, GS-R0-REJECT-001, GS-R0-SEED-001]
  conditions: []
  affected_books: [G0-B1]
  implementation_implications: This is the Book 1 constitutional control plane; missing policy information must fail closed to DENY.
  supersedes_decision_id: null
- decision_id: DEC-GOV-002
  title: Self-heal limited to runtime failures; policy changes require governed review
  status: RATIFIED
  category: control/governance
  statement: >-
    Autonomous self-heal may address infrastructure and retryable workflow failures only.
    Changing product policy, authority, or capabilities autonomously is rejected; such changes
    require governed review through explicit approval flows.
  rationale: Reject ledger rejects autonomous self-heal changing product policy/authority; seed package F includes approval flow.
  source_artifact_ids: [GS-R0-REJECT-001, GS-R0-SEED-001]
  conditions: []
  affected_books: [G0-B1, G0-B6]
  implementation_implications: Book 1 must make policy mutation a protected capability requiring approval above agent authority.
  supersedes_decision_id: null
- decision_id: DEC-DATA-001
  title: Postgres/durable governed state is authoritative truth
  status: RATIFIED
  category: data/source
  statement: >-
    PostgreSQL is the canonical operational datastore: accepted task intent, project state,
    domain facts, audit, and identity all live in migration-managed Postgres schemas.
    Scattered per-module SQLite databases and local USB/Obsidian vaults are rejected for production.
  rationale: OCE Block 1 doctrine adoption; reject ledger SQLite/Obsidian rejections; salvage map component table.
  source_artifact_ids: [GS-R0-MAP-001, GS-R0-REJECT-001, GS-R0-SEED-001]
  conditions: []
  affected_books: [G0-B2, G0-B3]
  implementation_implications: All persisted state designs in later books target Postgres domains with backups/restore.
  supersedes_decision_id: null
- decision_id: DEC-DATA-002
  title: Redis is non-authoritative transport/cache only
  status: RATIFIED
  category: data/source
  statement: >-
    Redis may transport wakeups/work items and cache, but accepted jobs and task truth survive
    Redis loss/restart because Postgres stores accepted task intent. Redis-as-sole-job-truth is rejected.
  rationale: Salvage map queue disposition; reject ledger explicit anti-pattern; seed architecture proof requirement "accepted tasks/projects survive Redis loss/restart".
  source_artifact_ids: [GS-R0-MAP-001, GS-R0-REJECT-001, GS-R0-SEED-001]
  conditions: []
  affected_books: [G0-B3]
  implementation_implications: Queue design must persist accepted tasks durably before enqueueing transport messages.
  supersedes_decision_id: null
- decision_id: DEC-DATA-003
  title: Executable source precedence with immutable snapshots
  status: RATIFIED
  category: data/source
  statement: >-
    Source authority and freshness rules are executable, fact-specific, and enforceable:
    current official solicitation dominates older copies and aggregators for issuer-owned facts;
    official structured datasets outrank third-party summaries for owned facts; search snippets
    never become promoted evidence; every promoted fact resolves to an immutable SourceSnapshot
    or approved structured dataset record; material revisions trigger dependency re-evaluation;
    unresolved conflicts fail closed for consequential decisions.
  rationale: Seed architecture section 6 elevates descriptive precedence to executable rules; deep hunt establishes the source inventory.
  source_artifact_ids: [GS-R0-SEED-001, GS-R0-DATA-001]
  conditions: []
  affected_books: [G0-B3, G0-B5]
  implementation_implications: SourceRegistry/SourceSnapshot/SourceRevisionEvent contracts are mandatory G0 freezes.
  supersedes_decision_id: null
- decision_id: DEC-DATA-004
  title: Federal/state/community source architecture
  status: RATIFIED
  category: data/source
  statement: >-
    Initial adapters: Grants.gov REST + Simpler.Grants.gov + SAM Assistance Listings (federal
    opportunity); USAspending (+TAGGS where relevant) for winner/history; IRS EO BMF + 990 XML +
    FAC for organization/capacity (ProPublica convenience only); Census ACS/SAIPE + BLS/BEA plus
    one domain layer for community evidence; state portals and targeted private web via governed crawl.
  rationale: Deep hunt resolved federal-baseline coverage; gap map marks funder/award domain model NEW BUILD with sources resolved.
  source_artifact_ids: [GS-R0-DATA-001, GS-R0-GAP-001, GS-R0-SEED-001]
  conditions:
    - Adapter set proves out against real sources in the first vertical slice before broadening.
  affected_books: [G0-B3, G0-B5]
  implementation_implications: Rewrite adapter layer on Research Mesh interface/reliability patterns; literal paper-specific clients are not portable.
  supersedes_decision_id: null
- decision_id: DEC-DATA-005
  title: CommonGrants interoperability mapping
  status: RATIFIED_WITH_CONDITION
  category: external repositories
  statement: >-
    Internal grant models map cleanly to the HHS-backed CommonGrants protocol for Opportunity,
    Application, and Award wherever practical. Internal-only fields (lineage, scores, QA, tenant
    policy) stay namespaced and do not contaminate the interoperability contract.
  rationale: Deep hunt elevates CommonGrants to design input; seed architecture section 3 defines the three mappings.
  source_artifact_ids: [GS-R0-DATA-001, GS-R0-SEED-001]
  conditions:
    - Mapping contracts freeze in G0 alongside internal contracts; deviations require recorded rationale.
  affected_books: [G0-B3]
  implementation_implications: >-
    The sectors/grants/interoperability/commongrants package owns adapters; the internal model remains richer.
  supersedes_decision_id: null
- decision_id: DEC-DATA-006
  title: Candid is optional paid enrichment, never a mandatory MVP dependency
  status: DEFERRED
  category: data/source
  statement: >-
    Candid enters only after free-source coverage is measured and ROI justifies it, as optional
    enrichment behind the SourceRegistry. It is not required for the MVP or first vertical slice.
  rationale: Seed architecture "what not to build yet" and Package D mark Candid optional; deep hunt treats it as paid enrichment.
  source_artifact_ids: [GS-R0-SEED-001, GS-R0-DATA-001]
  conditions: []
  affected_books: [G0-B5]
  implementation_implications: candid_optional adapter package is an extension point only until coverage/ROI evidence exists.
  supersedes_decision_id: null
- decision_id: DEC-EVID-001
  title: Deterministic eligibility kernel decides deterministic questions
  status: RATIFIED
  category: evidence
  statement: >-
    Eligibility and other normalized-rule numerical/logical questions are decided by a
    deterministic kernel reproducible from normalized facts. The model never decides
    deterministic questions after rules are normalized.
  rationale: Seed architecture law 4; reject ledger anti-pattern; gap map marks eligibility engine NEW BUILD.
  source_artifact_ids: [GS-R0-SEED-001, GS-R0-REJECT-001, GS-R0-GAP-001]
  conditions: []
  affected_books: [G0-B5]
  implementation_implications: EligibilityRule/EligibilityDecision/MatchExplanation contracts freeze in G0; matching output must be explainable.
  supersedes_decision_id: null
- decision_id: DEC-EVID-002
  title: Evidence confidence model; LLM self-confidence is not independent evidence
  status: RATIFIED
  category: evidence
  statement: >-
    Evidence confidence derives from source tier, directness, freshness/effective dates,
    geographic/population match, extraction quality, corroboration, and contradiction state.
    LLM self-ratings and hard-coded academic source rankings are rejected as grant evidence models.
  rationale: Salvage map evaluator rewrite requirements; reject ledger rejections; seed architecture proof list.
  source_artifact_ids: [GS-R0-MAP-001, GS-R0-REJECT-001]
  conditions: []
  affected_books: [G0-B3, G0-B5]
  implementation_implications: Grant-specific evidence hierarchy is NEW BUILD per gap map.
  supersedes_decision_id: null
- decision_id: DEC-EVID-003
  title: Relational Evidence Graph first; generic graph database deferred
  status: RATIFIED
  category: evidence
  statement: >-
    The Evidence Graph starts as explicit typed relationships (claim SUPPORTS snapshot,
    claim CONTRADICTS claim, rule DERIVED_FROM source, org SATISFIES/FAILS rule, etc.) over the
    canonical datastore. A generic cognition graph or Neo4j-first architecture is deferred/rejected
    as default until evidence proves need. Vector search supplements, never replaces,
    deterministic logic and lineage.
  rationale: Salvage map graph rewrite posture; reject ledger TurboVec/FAISS-default and Neo4j-first rejections.
  source_artifact_ids: [GS-R0-MAP-001, GS-R0-REJECT-001]
  conditions: []
  affected_books: [G0-B5]
  implementation_implications: Ontology is ours; Semantica bake-off evaluates substrate only (see DEC-EVID-004).
  supersedes_decision_id: null
- decision_id: DEC-EVID-004
  title: Semantica evidence/provenance substrate requires P0 bake-off
  status: PROTOTYPE_REQUIRED
  category: evidence
  statement: >-
    Semantica is a candidate substrate for the Grant Evidence Graph (claim→source provenance,
    conflicting facts, temporal state, decision chains, deterministic reasoning, auditable exports)
    and must pass the P0 bake-off against a relational baseline before any foundational commitment.
    It must never become an opaque sovereign truth source; canonical operational state stays
    product-owned.
  rationale: External repo review batch 02 disposition "PORT + WRAP candidate; potentially foundational"; MIT license observed but exact pin requires review; gap map P0 bake-off; guard against foundational-enthusiasm contradiction.
  source_artifact_ids: [R0-EXT-REVIEW-BATCH-02, GS-R0-GAP-001, GS-R0-SEED-001]
  conditions:
    - Bake-off compares Semantica against relational baseline on provenance fidelity, temporal state, export auditability, and operational cost.
  affected_books: [G0-B2, G0-B5]
  implementation_implications: Book 0 does not adopt Semantica as foundation; Books 2+ inherit the bake-off obligation.
  supersedes_decision_id: null
- decision_id: DEC-RES-001
  title: Research Mesh salvage — port contracts, rewrite persistence
  status: RATIFIED_WITH_CONDITION
  category: research
  statement: >-
    Research Mesh contributes the source-adapter interface, rate limiter/backoff, dedupe/write-gate
    concept, ResearchTask state shape, lifecycle/heartbeat/retry semantics, token/cost accounting,
    and synthesis pipeline. Persistence rewrites to Postgres; SQLite implementations are not ported;
    historical 106/106 test claims must be re-run against ported code before counting as proof.
  rationale: Salvage map section 5 dispositions; reject ledger SQLite queue/cache literal-implementation rejections.
  source_artifact_ids: [GS-R0-MAP-001, GS-R0-REJECT-001]
  conditions:
    - Re-run ported tests in the new environment before promoting any historical test-count claim.
    - Extend lifecycle with lease, authority scope, tenant scope, cancellation, idempotency keys, and escalation.
  affected_books: [G0-B2, G0-B3]
  implementation_implications: Worker lifecycle manager derives from lifecycle.py concepts with modern extensions.
  supersedes_decision_id: null
- decision_id: DEC-RES-002
  title: Crawl4AI governed web extraction
  status: PROTOTYPE_REQUIRED
  category: research
  statement: >-
    Crawl4AI is the candidate for governed web extraction (state portals, targeted foundation/
    corporate pages) and requires prototype evidence for extraction reliability and politeness
    before production adoption.
  rationale: Seed architecture Package C names Crawl4AI for governed web extraction; gap map bake-off table; expected baseline marks it PROTOTYPE_REQUIRED.
  source_artifact_ids: [GS-R0-SEED-001, GS-R0-GAP-001]
  conditions:
    - Extraction runs under rate limits and robots/politeness policy inside the Research Fabric.
  affected_books: [G0-B3]
