  supersedes_decision_id: null
- decision_id: DEC-RES-003
  title: GPT Researcher bounded research patterns
  status: PROTOTYPE_REQUIRED
  category: research
  statement: >-
    GPT Researcher contributes planning/execution/publisher patterns for bounded deep research.
    Prototype evidence must show cost/quality bounds before integration into grant research workflows.
  rationale: Seed architecture Package C and gap map identify GPT Researcher patterns as candidates requiring evidence rather than assumption.
  source_artifact_ids: [GS-R0-SEED-001, GS-R0-GAP-001]
  conditions:
    - Bounded execution with cost caps; outputs enter only via SourceSnapshot + evidence validation.
  affected_books: [G0-B3]
  implementation_implications: Search/discovery is not evidence; raw web claims cannot self-promote.
  supersedes_decision_id: null
- decision_id: DEC-PARSE-001
  title: Parser normalization contract with wrapped engines; Unstructured bake-off
  status: PROTOTYPE_REQUIRED
  category: parsing
  statement: >-
    The universal parser normalization contract (typed SourceDocument/Cognition Object with tenant
    identity, snapshot hash, authority tier, freshness, sensitivity, parsing confidence) is ratified;
    engines (MarkItDown, OpenDataLoader PDF, Chandra, Unstructured) remain wrapped replaceable
    workers. Unstructured vs the salvaged parser stack is a required bake-off.
  rationale: Salvage map parser dispositions (PORT contract / WRAP engines, confidence B pending fresh due diligence); gap map bake-off row.
  source_artifact_ids: [GS-R0-MAP-001, GS-R0-GAP-001]
  conditions:
    - License/maintenance/CVE recheck for each wrapped engine before production use.
  affected_books: [G0-B2, G0-B3]
  implementation_implications: SourceDocument contract freezes in G0; no engine becomes load-bearing without the bake-off.
  supersedes_decision_id: null
- decision_id: DEC-PARSE-002
  title: PixelRAG visual/layout fallback benchmark
  status: PROTOTYPE_REQUIRED
  category: parsing
  statement: >-
    PixelRAG is the candidate visual/layout fallback for scanned or visually complex grant
    documents and must win a fallback benchmark against text-layer extraction before adoption.
  rationale: Gap map bake-off table lists PixelRAG as fallback benchmark; seed architecture Package H names it.
  source_artifact_ids: [GS-R0-GAP-001, GS-R0-SEED-001]
  conditions: []
  affected_books: [G0-B3]
  implementation_implications: Fallback triggers only when primary parsers report low extraction confidence.
  supersedes_decision_id: null
- decision_id: DEC-SEC-001
  title: Zero secrets in memory, prompts, sidechains, logs, or Git
  status: RATIFIED
  category: security
  statement: >-
    No credential, API token, password, secret, or reusable authentication material may be written
    into either Hermes memory, sidechains, prompts, logs, or Git. Secrets live in scoped secret
    storage/service identities with server-side injection and redaction before logging.
  rationale: Critical security finding from archived Hermes memory containing raw credentials (salvage map 3.8, values intentionally omitted); Treg pattern reinforces server-side credential proxying.
  source_artifact_ids: [GS-R0-MAP-001, R0-EXT-REVIEW-BATCH-02]
  conditions: []
  affected_books: [G0-B1, G0-B6]
  implementation_implications: Book 1 audit redaction and credential-vault boundaries inherit this rule; eval() on stored metadata also rejected (JSON/schema-safe deserialization only).
  supersedes_decision_id: null
- decision_id: DEC-SEC-002
  title: Progressive skill disclosure pattern
  status: RATIFIED
  category: security
  statement: >-
    Skills load metadata broadly, bodies on trigger, and bundled resources only as needed,
    preventing context pollution and limiting blast radius of skill content.
  rationale: Salvage map 3.3 dispositions the archived progressive-disclosure pattern as ADOPT PATTERN.
  source_artifact_ids: [GS-R0-MAP-001]
  conditions: []
  affected_books: [G0-B4]
  implementation_implications: Skill registry design follows progressive disclosure; no full-workflow injection into every session.
  supersedes_decision_id: null
