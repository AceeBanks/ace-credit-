  source_artifact_ids: [GS-R0-GAP-001, GS-R0-SEED-001]
  affected_decisions: [DEC-EXT-003]
- candidate_id: CAND-ACTIVEPIECES
  capability_gap: Bounded connector execution fabric (notifications, later outreach)
  hypothesis: >-
    Self-hosted Activepieces reduces connector maintenance versus bespoke integrations while
    staying fully behind the capability/policy layer.
  baseline: Direct provider SDKs behind our own adapter interface.
  success_metrics: Connector coverage; audit-trail completeness through fabric; sandbox escape resistance.
  kill_criteria: Audit gaps between fabric and platform; credential-handling weaknesses; any path bypassing the policy engine.
  license_status: MIT core; enterprise edition differs — edition/license verification required before use.
  security_notes: Holds credentials — server-side vault/injection only; CD-003 forbids it conferring submission reach.
