# G0-B3-C6-C7 — Capture/Replay and Extraction/Normalization source of truth
# (fail-closed). Content addressing is verified by raw_hash; LLM/OCR output is
# a candidate structure, never an automatic CanonicalFact.

replay_classes:
  - EXACT_REPLAY
  - COMPATIBLE_REPLAY
  - PARTIAL_REPLAY
  - NON_REPLAYABLE

# NON_REPLAYABLE unacceptable for promoted critical data unless explicitly
# exempted.
critical_data_replay_rule: "NON_REPLAYABLE is only acceptable when exempted"

extraction_engines:
  - deterministic_json_mapper
  - html_parser
  - unstructured
  - markitdown
  - opendataloader_pdf
  - ocr
  - pixel_rag
  - llm_structured

# Outputs of these engines are CANDIDATE until separately verified.
candidate_only_engines:
  - llm_structured
  - ocr
  - pixel_rag

min_acceptable_confidence: 0.7

