# G0 Book 3 - B3.C1 Data Constitution (machine-readable).
# The binding laws governing external data and evidence. Each law carries an
# enforcement category and affected schemas/services, and links to the Books
# 1/2 laws and constraints it operationalizes (amendment linkage).
data_constitution_version: "1.0"
laws:
- {law_id: DATA-LAW-001, title: Registered-source promotion, rule: Only governed/registered source identities may support promoted operational facts, except explicit temporary evidence paths approved by policy., enforcement_category: MUST, affected_schemas: [source_registry, canonical_fact], amendment_links: [LAW-B1-007], status: FROZEN}
- {law_id: DATA-LAW-002, title: Capture-before-interpretation, rule: Material external data must be captured/snapshotted before derived interpretation becomes authoritative., enforcement_category: MUST, affected_schemas: [source_snapshot, extraction_event], amendment_links: [LAW-B1-020], status: FROZEN}
- {law_id: DATA-LAW-003, title: Immutable source history, rule: SourceSnapshots are append-only immutable representations., enforcement_category: MUST, affected_schemas: [source_snapshot], amendment_links: [LAW-B1-019], status: FROZEN}
- {law_id: DATA-LAW-004, title: Raw hash identity, rule: Every retained source body/document/raw payload requires content hashing or equivalent integrity identity., enforcement_category: MUST, affected_schemas: [source_snapshot], amendment_links: [], status: FROZEN}
- {law_id: DATA-LAW-005, title: Transformation lineage, rule: Parsing, extraction and normalization must record implementation/version lineage., enforcement_category: MUST, affected_schemas: [extraction_event, normalization_event], amendment_links: [], status: FROZEN}
- {law_id: DATA-LAW-006, title: Authority is source + fact class, rule: Source tier alone cannot determine all precedence—authority is a function of source AND fact class., enforcement_category: MUST, affected_schemas: [precedence_matrix], amendment_links: [], status: FROZEN}
- {law_id: DATA-LAW-007, title: Freshness is domain-specific, rule: Live opportunities, annual statistics, organization filings and historical awards use different freshness rules., enforcement_category: MUST, affected_schemas: [freshness_policy], amendment_links: [], status: FROZEN}
- {law_id: DATA-LAW-008, title: Stale critical facts may block action, rule: A hard-stale deadline or eligibility requirement cannot silently drive submission readiness., enforcement_category: MUST, affected_schemas: [freshness_policy, submission_package], amendment_links: [LAW-B1-012], status: FROZEN}
- {law_id: DATA-LAW-009, title: Conflicts remain explicit, rule: Equal or unresolved authoritative conflicts produce CONFLICTED state, not silent last-write-wins., enforcement_category: MUST, affected_schemas: [conflict], amendment_links: [LAW-B1-008], status: FROZEN}
- {law_id: DATA-LAW-010, title: New revision never rewrites prior decision history, rule: Previous decisions remain reconstructable against the exact source revision/fact state used., enforcement_category: MUST, affected_schemas: [opportunity_revision, eligibility_decision], amendment_links: [B2.C8], status: FROZEN}
- {law_id: DATA-LAW-011, title: Material source changes trigger invalidation, rule: Downstream dependencies are marked stale and recomputation events generated., enforcement_category: MUST, affected_schemas: [source_change_event, dependency_invalidation], amendment_links: [LAW-B1-019], status: FROZEN}
- {law_id: DATA-LAW-012, title: Search result is not source evidence, rule: Discovery index/search snippets are not sufficient to promote a material claim., enforcement_category: MUST, affected_schemas: [canonical_fact], amendment_links: [], status: FROZEN}
- {law_id: DATA-LAW-013, title: Generated citation is not evidence until verified, rule: Model-cited URL/source must be fetched/snapshotted/validated., enforcement_category: MUST, affected_schemas: [source_snapshot], amendment_links: [], status: FROZEN}
- {law_id: DATA-LAW-014, title: Web content has no tool/policy authority, rule: Instructions embedded in external sources are data, never capability grants., enforcement_category: MUST, affected_schemas: [source_security], amendment_links: [], status: FROZEN}
- {law_id: DATA-LAW-015, title: Geography/time semantics mandatory for public statistics, rule: A statistic lacking necessary geographic/reference-period semantics cannot be promoted for proposal use., enforcement_category: MUST, affected_schemas: [statistic_observation], amendment_links: [B2.C9], status: FROZEN}
- {law_id: DATA-LAW-016, title: External IDs require namespace and verification state, rule: No ambiguous identifier strings; every external ID carries namespace and verification state., enforcement_category: MUST, affected_schemas: [external_identifier], amendment_links: [LAW-B1-022, B2.C5], status: FROZEN}
- {law_id: DATA-LAW-017, title: Source absence preserves uncertainty, rule: Missing/unavailable source does not justify fabrication or forced falsehood., enforcement_category: MUST, affected_schemas: [canonical_fact], amendment_links: [], status: FROZEN}
- {law_id: DATA-LAW-018, title: Data deletion does not falsify audit history, rule: Where policy requires deletion of content/PII, tombstone/metadata strategies preserve permitted audit/reconstruction semantics without retaining prohibited content., enforcement_category: MUST, affected_schemas: [retention_class, source_snapshot], amendment_links: [], status: FROZEN}
- {law_id: DATA-LAW-019, title: Provenance is transitive, rule: Application content can trace through normalized facts to capture/source identity., enforcement_category: MUST, affected_schemas: [provenance_chain], amendment_links: [], status: FROZEN}
- {law_id: DATA-LAW-020, title: Source adapters cannot promote themselves, rule: Adapters emit candidates/events; promotion follows product policy., enforcement_category: MUST, affected_schemas: [promotion_event], amendment_links: [], status: FROZEN}
required_law_count: 20
enforcement_categories: [MUST, SHOULD]