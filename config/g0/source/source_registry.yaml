# G0 Book 3 - B3.C3 SourceRegistry (machine-readable, seed).
# `source_id` identifies a GOVERNED LOGICAL SOURCE, not one fetched page.
# Declares the full field contract from the plan; seed rows cover the initial
# federal/Georgia/statistical sources. `enabled` governs fresh promotion;
# historical data stays queryable/retainable even when disabled.
source_registry_version: "1.0"
field_contract:
- source_id
- name
- source_class
- authority_tier
- owner_organization
- jurisdiction
- domain_categories
- access_modes
- base_urls
- api_base_url
- auth_mode
- credential_scope_ref
- expected_update_frequency
- default_freshness_policy
- terms_policy_ref
- robots_policy_ref
- rate_limit_policy_ref
- adapter_name
- adapter_version
- parser_strategy
- health_policy_ref
- pii_classification
- retention_class
- enabled
