# G0-B3-C4-C5 — Onboarding & SourceSnapshot source of truth (fail-closed).

# Governance rule: an agent discovering a useful site may create a
# SourceCandidate or research note. It may NOT automatically add that domain to
# production allowlists. Promotion requires passing every staged gate and being
# explicitly ENABLED.

onboarding_stages:
  - identity_ownership_check
  - terms_robots_access_review
  - authority_classification
  - data_shape_analysis
  - adapter_capture_strategy
  - fixture_capture
  - schema_parser_tests
  - rate_limit_failure_test
  - security_prompt_injection_test
  - source_health_policy
  - enabled

source_statuses:
  - CANDIDATE
  - REVIEWING
  - FIXTURE_ONLY
  - ENABLED
  - DEGRADED
  - DISABLED
  - RETIRED

# Seed onboarding packets for the sources in the registry.
onboarding_packets:
  grants_gov_federal:
    source_identity: "Grants.gov Workspace — federal issuer portal"
    legal_access_notes: "Public data portal; terms permit programmatic access"
    authority_fact_classes:
      - opportunity
      - award
      - applicant
    capture_approach: "API_JSON"
    parser_approach: "json_schema_validated"
    freshness_rule: "daily"
    failure_behavior: "capture_failure_tombstone"
    health_probes:
      - "SOAP status check"
    operational_owner: "platform-team"
  ga_grants_marketplace:
    source_identity: "Georgia Grants Marketplace — state aggregator"
    legal_access_notes: "Public portal; rosters of state opportunities"
    authority_fact_classes:
      - opportunity
      - organization
    capture_approach: "API_JSON"
    freshness_rule: "daily"
    health_probes:
      - "row-count probe"

