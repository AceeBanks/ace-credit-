    metric_label: "Poverty rate"
    value: 14.8
    unit: percent
    geography_type: county
    geography_id: "13121"
    geography_label: "Fulton County, GA"
    population_scope: all_persons
    reference_period_start: "2023-01-01"
    reference_period_end: "2023-12-31"
    dataset_name: "Census ACS 5-Year"
    dataset_vintage: "2023"
    estimate_type: percent_estimate
    margin_of_error: 0.9
