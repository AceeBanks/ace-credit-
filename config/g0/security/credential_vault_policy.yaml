# G0-B6-C8 — Credential Vault Constitution

policy_id: G0-B6-C8
version: "1.0"

secret_classes:
  - API_KEY
  - OAUTH_ACCESS_TOKEN
  - OAUTH_REFRESH_TOKEN
  - SERVICE_TOKEN
  - SIGNING_KEY
  - DATABASE_CREDENTIAL
  - WEBHOOK_SECRET
  - PORTAL_CREDENTIAL

vault_requirements:
  - encryption_at_rest
  - access_audit
  - rotation_and_revocation
  - no_plaintext_application_logs
  - no_secret_export_to_agent_context
  - environment_injection_only_where_bounded
  - oauth_tokens_tied_to_correct_tenant_account

rules:
  - id: VAULT-001
    text: "Agents and services receive opaque CredentialReference ids, never raw secrets (SEC-LAW-006)."
  - id: VAULT-002
    text: "A credential reference is usable only for its allowed capabilities and allowed destinations."
  - id: VAULT-003
    text: "A credential reference is bound to its tenant; wrong-tenant use is denied."
  - id: VAULT-004
    text: "Rotation preserves the same capability without changing agent prompts or Hermes memory."
  - id: VAULT-005
    text: "Serialized prompts, sidechains and logs must contain no raw secret; redaction is mandatory."
  - id: VAULT-006
    text: "Revocation denies immediately; a revoked credential cannot fetch."
  - id: VAULT-007
    text: "A worker runtime may read only credentials within its granted capability; arbitrary vault reads are denied."

rotation_policy:
  max_age_days: 90
  preserves_capability: true
  no_agent_prompt_change: true
